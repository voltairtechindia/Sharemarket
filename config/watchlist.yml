# Yahoo Finance symbols. No API key needed.
# Add or remove freely, the dashboard renders whatever is here.

headline:            # shown large at the top of the page
  - { symbol: "^NSEI",     label: "Nifty 50" }
  - { symbol: "^NSEBANK",  label: "Bank Nifty" }
  - { symbol: "^BSESN",    label: "Sensex" }
  - { symbol: "^INDIAVIX", label: "India VIX" }

india:
  - { symbol: "NIFTY_MIDCAP_100.NS", label: "Nifty Midcap 100" }
  - { symbol: "^CNXIT",              label: "Nifty IT" }
  - { symbol: "^CNXAUTO",            label: "Nifty Auto" }
  - { symbol: "^CNXPHARMA",          label: "Nifty Pharma" }
  - { symbol: "^CNXMETAL",           label: "Nifty Metal" }
  - { symbol: "^CNXFMCG",            label: "Nifty FMCG" }

global:
  - { symbol: "^GSPC",     label: "S&P 500" }
  - { symbol: "^IXIC",     label: "Nasdaq" }
  - { symbol: "^DJI",      label: "Dow Jones" }
  - { symbol: "^VIX",      label: "CBOE VIX" }
  - { symbol: "^N225",     label: "Nikkei 225" }
  - { symbol: "^HSI",      label: "Hang Seng" }
  - { symbol: "^FTSE",     label: "FTSE 100" }
  - { symbol: "^GDAXI",    label: "DAX" }

macro:
  - { symbol: "USDINR=X",  label: "USD / INR" }
  - { symbol: "DX-Y.NYB",  label: "Dollar Index" }
  - { symbol: "CL=F",      label: "Crude (WTI)" }
  - { symbol: "BZ=F",      label: "Crude (Brent)" }
  - { symbol: "GC=F",      label: "Gold" }
  - { symbol: "SI=F",      label: "Silver" }
  - { symbol: "BTC-USD",   label: "Bitcoin" }

# Heaviest Nifty weights, useful for explaining index moves
movers:
  - { symbol: "RELIANCE.NS",   label: "Reliance" }
  - { symbol: "HDFCBANK.NS",   label: "HDFC Bank" }
  - { symbol: "ICICIBANK.NS",  label: "ICICI Bank" }
  - { symbol: "INFY.NS",       label: "Infosys" }
  - { symbol: "TCS.NS",        label: "TCS" }
  - { symbol: "BHARTIARTL.NS", label: "Bharti Airtel" }
  - { symbol: "SBIN.NS",       label: "SBI" }
  - { symbol: "LT.NS",         label: "L&T" }
  - { symbol: "AXISBANK.NS",   label: "Axis Bank" }
  - { symbol: "KOTAKBANK.NS",  label: "Kotak Bank" }
  - { symbol: "ITC.NS",        label: "ITC" }
  - { symbol: "TATAMOTORS.NS", label: "Tata Motors" }

# F&O option chain. Both routes are optional and fail quietly.
options:
  symbols: ["NIFTY", "BANKNIFTY"]
  strikes_around_atm: 10

  # NSE blocks datacenter IPs, so this stays off inside GitHub Actions.
  # It turns on automatically when you run the scripts on your own machine.
  # Force it on a runner with env FORCE_NSE=1 if you want to test.
  nse_direct: true

  # Free with a Dhan account. Add DHAN_ACCESS_TOKEN and DHAN_CLIENT_ID as repo
  # secrets and this becomes the primary source, works fine from Actions.
  dhan: true
