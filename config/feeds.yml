  - { name: "r/NSEbets",          url: "https://www.reddit.com/r/NSEbets/new/.rss" }
  - { name: "r/IndiaInvestments", url: "https://www.reddit.com/r/IndiaInvestments/new/.rss" }
  - { name: "r/DalalStreetTalks", url: "https://www.reddit.com/r/DalalStreetTalks/new/.rss" }

# X handles, read through Nitter-fork RSS. This lane is expected to break sometimes.
# X Corp sent takedown letters to Nitter instances in Aug 2026, so public mirrors
# come and go. The dashboard keeps working when this returns nothing.
# Add more mirror hosts as you find them, they are tried in order.
x_mirrors:
  - "https://xcancel.com"

x_handles:
  - realDonaldTrump
  - RBI
  - nsitharaman
  - FinMinIndia
  - NSEIndia
  - zerodhaonline
  - deepakshenoy
  - Nifty_Banknifty

# Public Telegram channels, read from the t.me web preview. No key, no account.
# Put the channel handle without the @.
telegram:
  - stockmarketnewsindia
  - nsebseupdates
