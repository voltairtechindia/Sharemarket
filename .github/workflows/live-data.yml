name: Live market and news data

# ---------------------------------------------------------------------------
# Where the data goes, and why it is not the published branch.
#
# GitHub Pages rebuilds the site on every push to the branch it is built from,
# and throttles those builds to roughly ten an hour. A five minute data cycle is
# twelve an hour before you count code changes, so committing live data to the
# published branch means the page you load is always several cycles behind the
# commit that produced it. Pushing data faster does not help; it just queues.
#
# So data is force-pushed to a separate `live-data` branch that Pages never
# builds, and the page reads it from raw.githubusercontent.com, which serves
# with CORS headers within seconds of the push. The published branch keeps a
# periodic snapshot (see snapshot.yml) purely as the offline fallback.
#
# The branch is rewritten as a single orphan commit each time. Fourteen hundred
# commits a day of churned JSON would otherwise turn a small repo into a very
# large one inside a month.
# ---------------------------------------------------------------------------
on:
  schedule:
    # This asks for twelve runs an hour. GitHub does not give twelve runs an
    # hour. Measured starts on 17-18 Sep 2026: 07:53, 12:53, 17:23, 20:26,
    # 22:59, 01:12 UTC - about one run every two and a half hours. Scheduled
    # workflows on a low-activity repo are deprioritised and the skipped
    # firings are dropped, not queued. Lowering the number here would not help
    # (the same throttle applies) and raising the cadence is not available on
    # the free tier, so the expression stays as the ceiling we would take if
    # offered, and the README says plainly what actually arrives.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/live-data.yml"

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Seed data/ from the live branch so a lane that fails this run keeps the
      # last good value instead of publishing an empty file.
      - name: Seed from the live branch
        run: |
          git fetch origin live-data --depth=1 || exit 0
          git checkout origin/live-data -- data/ 2>/dev/null || true
          ls -la data/ | head -30

      # The seed above restores every file the live branch holds, which is the
      # point - a lane that fails this run keeps its last good value. It also
      # restores files that were retired, because the live branch still has
      # them and nothing on that branch ever deletes anything.
      #
      # Five files were removed on 20 Sep 2026 for being written and never
      # read (see CLAUDE.md). Without this step the seed would hand them back
      # every run, the snapshot would copy them to main, and deleting them
      # would be a thing somebody has to redo forever.
      #
      # A name leaves this list only when the file is genuinely wanted again.
      - name: Drop retired lanes the seed brought back
        run: |
          rm -f data/market.json data/predictions.json data/live_impact.json \
                data/social.json data/rss_config.json
          echo "retired lanes pruned"

      - name: Rebuild feed index if config changed
        run: python scripts/feeds_build.py
        continue-on-error: true

      - name: Refresh the stock universe
        run: python scripts/build_universe.py
        continue-on-error: true

      - name: Fetch market data and seasonality
        run: python scripts/fetch_market.py
        continue-on-error: true

      - name: Fetch global cues
        run: python scripts/fetch_global.py
        continue-on-error: true

      # IPOs: the pipeline, the live book, the official filing links and the
      # listing gains computed from each listed symbol's own series.
      - name: Fetch IPOs
        run: python scripts/fetch_ipo.py
        continue-on-error: true

      - name: Fetch breadth and institutional flows
        run: python scripts/fetch_flows.py
        continue-on-error: true

      # The only forward-looking lane in the model: PCR on today's open
      # interest, the OI walls and max pain. Browser-side is impossible - NSE
      # answers with Access-Control-Allow-Origin: beta.nseindia.com - so it has
      # to come from here, and it is therefore as old as the last run. The lane
      # drops itself past four hours rather than voting on stale positioning.
      - name: Fetch the NIFTY option chain
        run: python scripts/fetch_options.py
        continue-on-error: true

      # NSE trading holidays, which advance() needs so a projection does not
      # walk through Diwali, plus the scheduled global releases. Both change
      # rarely, so this is cheap to run every cycle and there is no value in
      # scheduling it separately.
      - name: Fetch the exchange calendar
        run: python scripts/fetch_events.py
        continue-on-error: true

      # Index membership, so the news lane can tell a NIFTY story from a
      # microcap filing. Changes a few times a year; cheap enough to re-fetch.
      - name: Fetch index constituents
        run: python scripts/fetch_constituents.py
        continue-on-error: true

      - name: Fetch stock quotes
        run: python scripts/fetch_stocks.py
        continue-on-error: true

      - name: Fetch corporate filings
        run: python scripts/fetch_filings.py
        continue-on-error: true

      - name: Fetch and score news
        run: python scripts/fetch_news.py
        continue-on-error: true

      # The news lane is the heaviest in the forecast (0.24) and has never been
      # scored, because nothing ever kept the headlines. calibrate() can replay
      # momentum and levels from the price series; it cannot replay a feed that
      # was not saved. This starts saving it. It becomes backtestable in about
      # three months, which is why it ships now rather than when it is needed.
      - name: Archive today's headlines
        run: python scripts/archive_news.py
        continue-on-error: true

      - name: Publish to the live branch
        run: bash scripts/publish_live.sh

      # GitHub's scheduler fires this at best every five minutes and is often
      # late. The rest of the window is covered here: four more news sweeps a
      # minute apart, each published as it lands. News is the only lane that
      # changes minute to minute, so it is the only one repeated.
      - name: Minute lane
        run: |
          for i in 1 2 3 4; do
            sleep 60
            python scripts/fetch_news.py || true
            python scripts/fetch_filings.py || true
            python scripts/archive_news.py || true
            bash scripts/publish_live.sh || true
          done
